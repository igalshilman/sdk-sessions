packages:
  - packages/*
  # @restatedev/sessions' addon, a package per platform.
  - packages/sessions/npm/*
# Dependencies whose install scripts run (npm ran them all).
allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  # restate-server's usage analytics: not run.
  '@scarf/scarf': false
  esbuild: true
  protobufjs: true
  tree-sitter-bash: true
  tree-sitter-powershell: true
# Releases newer than pnpm's minimum age, taken on purpose: the Restate SDK, agentlib and pi.
minimumReleaseAgeExclude:
  - '@restatedev/restate-sdk-clients@1.18.2'
  - '@restatedev/restate-sdk-core@1.18.2'
  - '@restatedev/restate-sdk@1.18.2'
  - '@restatedev/agentlib@0.2.0'
  - '@earendil-works/chord@1.7.0'
  - '@earendil-works/pi-ai@1.7.0'
  - '@earendil-works/pi-codemode@1.7.0'
  - '@earendil-works/pi-durable@1.7.0'
  - '@earendil-works/pi-schema@1.7.0'
  - '@earendil-works/pi-telemetry@1.7.0'
